name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build registry
        run: pnpm registry:build

      - name: Check generated files are committed
        run: git diff --exit-code -- apps/v1/examples/__index__.tsx apps/v1/registry/blocks/__index__.tsx

      - name: Lint
        run: pnpm lint

      - name: Generate Next.js types
        working-directory: apps/v1
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
